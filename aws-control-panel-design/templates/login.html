<!doctype html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <title>Sign in · AWS Environment Control</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% include "_icons.html" %}
  <div class="login-theme"><button class="theme-toggle" type="button" aria-label="Switch to light theme" title="Switch to light theme"><svg class="ic ic-sun"><use href="#i-sun"/></svg><svg class="ic ic-moon"><use href="#i-moon"/></svg></button></div>
  <main class="login">
    <div class="login-wrap">
      <img class="logo logo-on-light" src="{{ url_for('static', filename='img/l180-logo.svg') }}" alt="L180 Labs">
      <img class="logo logo-on-dark" src="{{ url_for('static', filename='img/l180-logo-dark.svg') }}" alt="L180 Labs">

      <div class="login-card">
        <h1>AWS Environment <span class="accent">Control</span></h1>
        <p class="sub">Sign in with your {{ allowed_domain }} Google account to start and stop client environments.</p>

        {% if error %}
        <div class="alert-l" id="login-alert" role="alert">
          <svg class="ic"><use href="#i-alert"/></svg>
          <span>{{ error }}</span>
        </div>
        {% endif %}

        <a class="btn-l btn-google btn-block" id="google-btn" href="{{ url_for('login_google') }}">
          <span class="spin" aria-hidden="true"></span>
          <svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Sign in with Google</span>
        </a>
      </div>

    </div>
  </main>
  <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</body>
</html>
