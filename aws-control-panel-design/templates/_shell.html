<!--shell-->
<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog class="confirm" id="confirm" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title">Stop?</h2>
    <p id="confirm-body"></p>
    <div class="confirm-actions">
      <button class="btn-l btn-line" value="cancel" type="submit">Cancel</button>
      <button class="btn-l btn-danger" id="confirm-ok" value="ok" type="submit">Stop</button>
    </div>
  </form>
</dialog>
<!--/shell-->
